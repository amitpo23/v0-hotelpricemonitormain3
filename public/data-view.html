<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תצוגת נתונים - Cockpit Hotel Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
            background: linear-gradient(90deg, #06b6d4, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(90deg, #06b6d4, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 1.1em;
            color: #94a3b8;
            margin-top: 10px;
        }
        .chart-container {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .table-container {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(6, 182, 212, 0.1);
            font-weight: bold;
        }
        tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .success {
            color: #10b981;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Cockpit Hotel Monitor - תצוגת נתונים בזמן אמת</h1>
            <p>נתוני מתחרים שנסרקו מ-Booking.com</p>
        </div>

        <div id="loading" class="loading">⏳ טוען נתונים מהבסיס...</div>

        <div id="content" style="display: none;">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalRecords">0</div>
                    <div class="stat-label">סה"כ מחירים שנסרקו</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgPrice">€0</div>
                    <div class="stat-label">מחיר ממוצע</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="minPrice">€0</div>
                    <div class="stat-label">מחיר מינימום</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="maxPrice">€0</div>
                    <div class="stat-label">מחיר מקסימום</div>
                </div>
            </div>

            <div class="chart-container">
                <h2>📊 גרף מחירי מתחרים לפי תאריך</h2>
                <canvas id="priceChart"></canvas>
            </div>

            <div class="table-container">
                <h2>📋 מחירי מתחרים - 20 התוצאות האחרונות</h2>
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>תאריך</th>
                            <th>מחיר</th>
                            <th>סוג חדר</th>
                            <th>זמין</th>
                            <th>מקור</th>
                            <th>תאריך סריקה</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dqhmraeyisoigxzsitiz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxaG1yYWV5aXNvaWd4enNpdGl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNTcxODEsImV4cCI6MjA3OTYzMzE4MX0.gOmmQBEpT2GJw97dFmlVBX1CtGpfAhARX71K3NlIx8I';

        async function loadData() {
            try {
                // Fetch recent competitor prices
                const response = await fetch(`${SUPABASE_URL}/rest/v1/competitor_daily_prices?select=*&scraped_at=gte.2025-12-25T06:00:00&order=scraped_at.desc&limit=100`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('loading').innerHTML = '❌ אין נתונים זמינים';
                    return;
                }

                // Hide loading, show content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // Calculate stats
                const prices = data.map(d => parseFloat(d.price)).filter(p => p > 0);
                const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
                const minPrice = Math.min(...prices);
                const maxPrice = Math.max(...prices);

                document.getElementById('totalRecords').textContent = data.length;
                document.getElementById('avgPrice').textContent = '€' + avgPrice.toFixed(0);
                document.getElementById('minPrice').textContent = '€' + minPrice.toFixed(0);
                document.getElementById('maxPrice').textContent = '€' + maxPrice.toFixed(0);

                // Populate table
                const tbody = document.getElementById('tableBody');
                data.slice(0, 20).forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td class="success">€${parseFloat(row.price).toFixed(2)}</td>
                        <td>${row.room_type || 'Standard'}</td>
                        <td>${row.availability ? '✅ כן' : '❌ לא'}</td>
                        <td>${row.source}</td>
                        <td>${new Date(row.scraped_at).toLocaleString('he-IL')}</td>
                    `;
                    tbody.appendChild(tr);
                });

                // Create chart
                const groupedByDate = {};
                data.forEach(row => {
                    if (!groupedByDate[row.date]) {
                        groupedByDate[row.date] = [];
                    }
                    groupedByDate[row.date].push(parseFloat(row.price));
                });

                const dates = Object.keys(groupedByDate).sort().slice(0, 30);
                const avgPricesByDate = dates.map(date => {
                    const prices = groupedByDate[date];
                    return prices.reduce((a, b) => a + b, 0) / prices.length;
                });
                const minPricesByDate = dates.map(date => Math.min(...groupedByDate[date]));
                const maxPricesByDate = dates.map(date => Math.max(...groupedByDate[date]));

                const ctx = document.getElementById('priceChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'מחיר ממוצע',
                                data: avgPricesByDate,
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                tension: 0.4,
                                fill: true
                            },
                            {
                                label: 'מחיר מינימום',
                                data: minPricesByDate,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                tension: 0.4,
                                borderDash: [5, 5]
                            },
                            {
                                label: 'מחיר מקסימום',
                                data: maxPricesByDate,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                tension: 0.4,
                                borderDash: [5, 5]
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: 'white'
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: 'white' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            y: {
                                ticks: { color: 'white' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = '❌ שגיאה בטעינת נתונים: ' + error.message;
            }
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
